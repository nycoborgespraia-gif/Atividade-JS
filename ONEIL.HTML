<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orlando magic</title>
</head>
<body>
   <script>


let n = Number(prompt("Digite um número:"));
let primo = n > 1;

for (let i = 2; i < n; i++) {
    if (n % i == 0)
        primo = false;
}

if (primo)
    alert("É primo!");
else
    alert("Não é primo!");





   </script> 
</body>
</html>

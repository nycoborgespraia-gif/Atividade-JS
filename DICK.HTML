<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orlando magic</title>
</head>
<body>
    <script>
let a = Number(prompt("Digite o 1º número:"));
let b = Number(prompt("Digite o 2º número:"));
let c = Number(prompt("Digite o 3º número:"));

if (a == b && b == c)
    alert("Os três números são iguais!");
else
    alert("O maior é " + Math.max(a, b, c));




    </script>
</body>
</html>
